plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def wave2Provider = providers.gradleProperty('wave2Provider').orElse('').get().trim()
def libertyTaczOption = providers.gradleProperty('libertyTacz').orElse('false').get().trim()
if (!['true', 'false'].contains(libertyTaczOption)) {
    throw new GradleException('Use -PlibertyTacz=true or -PlibertyTacz=false')
}
def libertyTacz = libertyTaczOption == 'true'
def libertyHelldiversOption = providers.gradleProperty('libertyHelldivers').orElse('false').get().trim()
if (!['true', 'false'].contains(libertyHelldiversOption)) {
    throw new GradleException('Use -PlibertyHelldivers=true or -PlibertyHelldivers=false')
}
def libertyHelldivers = libertyHelldiversOption == 'true'
def libertyPackOption = providers.gradleProperty('libertyPackExpected').orElse(libertyTaczOption).get().trim()
if (!['true', 'false'].contains(libertyPackOption) || (libertyPackOption == 'true' && !libertyTacz)) {
    throw new GradleException('Use -PlibertyPackExpected=true|false; a true value also requires -PlibertyTacz=true')
}
def validProviderSelections = ['', 'alexsmobs', 'alexscaves', 'cataclysm', 'all',
                               'aether', 'irons_spells', 'aoa', 'adventure_all']
if (!validProviderSelections.contains(wave2Provider)) {
    throw new GradleException("Unknown -Pwave2Provider=" + wave2Provider)
}
// Keep the existing exhaustive Wave 2 roster test scoped to its curated namespaces. The new
// adventure lanes use their own presence/behavior proofs, not fabricated Wave 2 manifests.
def wave2RosterProvider = ['aether', 'irons_spells', 'aoa'].contains(wave2Provider) ? '' :
                         (wave2Provider == 'adventure_all' ? 'cataclysm' : wave2Provider)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            property 'jetsetcraft.wave2Provider', wave2RosterProvider
            property 'jetsetcraft.providerSelection', wave2Provider
            property 'jetsetcraft.libertyTacz', libertyTacz.toString()
            property 'jetsetcraft.libertyHelldivers', libertyHelldivers.toString()
            property 'jetsetcraft.libertyPackExpected', libertyPackOption
            args '--mixin', 'jetsetcraft.liberty.mixins.json'
            // Production provider jars ship SRG/refmap mixin targets. ForgeGradle's named userdev runtime
            // must remap those targets for GameTest/server verification; production Minecraft does not need this.
            if (!wave2Provider.isEmpty() || libertyTacz || libertyHelldivers) {
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', file("${buildDir}/createSrgToMcp/output.srg").absolutePath
            }
            mods { jetsetcraft { source sourceSets.main } }
        }
        client {
            // PlayerAnimator ships production (SRG) mixin targets; remap those targets in Forge's named dev runtime.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file("${buildDir}/createSrgToMcp/output.srg").absolutePath
            property 'jetsetcraft.visualAudit', System.getProperty('jetsetcraft.visualAudit', 'false')
            property 'jetsetcraft.rushVisualAudit', System.getProperty('jetsetcraft.rushVisualAudit', 'false')
            property 'jetsetcraft.libertyVisualAudit', System.getProperty('jetsetcraft.libertyVisualAudit', 'false')
            property 'jetsetcraft.libertyCampaignVisualAudit', System.getProperty('jetsetcraft.libertyCampaignVisualAudit', 'false')
            if (System.getProperty('jetsetcraft.libertyVisualAudit', 'false') == 'true') {
                if (System.getProperty('jetsetcraft.rushVisualAudit', 'false') == 'true'
                        || System.getProperty('jetsetcraft.visualAudit', 'false') == 'true')
                    throw new GradleException('Run the Liberty Grind visual audit separately.')
                args '--quickPlaySingleplayer', 'LibertyGrindAudit', '--width', '960', '--height', '720'
            } else if (System.getProperty('jetsetcraft.rushVisualAudit', 'false') == 'true') {
                if (System.getProperty('jetsetcraft.visualAudit', 'false') == 'true') {
                    throw new GradleException('Run the ordinary and Rival Rush visual audits separately.')
                }
                args '--quickPlaySingleplayer', 'RivalRushAudit', '--width', '1280', '--height', '720'
            } else if (System.getProperty('jetsetcraft.visualAudit', 'false') == 'true') {
                args '--quickPlaySingleplayer', 'New World'
            }
        }
        server { args '--nogui' }
        gameTestServer {
            // Keep independent verification lanes in distinct disposable directories when requested.
            // The ordinary developer and CI invocation still uses run/.
            workingDirectory project.file(providers.gradleProperty('gameTestRunDirectory').orElse('run').get())
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven { name = 'KosmX'; url = 'https://maven.kosmx.dev/' }
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net'
        content { includeGroup 'com.simibubi.create' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${player_anim_version}")

    // Create 6.0.8 is optional at runtime; the official slim artifact compiles the native track geometry adapter.
    compileOnly fg.deobf("com.simibubi.create:create-1.20.1:6.0.8-289:slim") { transitive = false }

    // Exact optional Helldivers verification lane. This adds no production dependency or packaged JAR.
    // The upstream release requires only Forge/Minecraft; the pack is prepared separately in run/tacz.
    if (libertyTacz) {
        runtimeOnly fg.deobf("curse.maven:timeless-and-classics-zero-1028108:9037989") // TaCZ 1.1.8-hotfix2
    }

    // Real Helldivers call-in provider, optional and separate from the TaCZ gun-pack lane.
    if (libertyHelldivers) {
        runtimeOnly fg.deobf("curse.maven:mcdiver-1738922:9307472") // MCDivers 1.0.3, Forge 1.20.1; no companion dependency
    }

    // Provider-present verification is opt-in. These never enter JetSetCraft's normal runtime dependency set
    // or mods.toml, so production remains fully optional/fail-soft when the provider is absent.
    def testAlexsMobs = wave2Provider == 'alexsmobs' || wave2Provider == 'all'
    def testAlexsCaves = wave2Provider == 'alexscaves' || wave2Provider == 'all'
    def testCataclysm = ['cataclysm', 'all', 'adventure_all'].contains(wave2Provider)
    def testAether = wave2Provider == 'aether' || wave2Provider == 'adventure_all'
    def testIronsSpells = wave2Provider == 'irons_spells' || wave2Provider == 'adventure_all'
    def testAoA = wave2Provider == 'aoa' || wave2Provider == 'adventure_all'

    if (testAlexsMobs || testAlexsCaves) {
        runtimeOnly fg.deobf("curse.maven:citadel-331936:7476570") // Citadel 2.6.3, shared by both Alex providers
    }
    if (testAlexsMobs) {
        runtimeOnly fg.deobf("curse.maven:alexs-mobs-426558:5698791") // Alex's Mobs 1.22.9
    }
    if (testAlexsCaves) {
        runtimeOnly fg.deobf("curse.maven:alexs-caves-924854:5848216") // Alex's Caves 2.0.2
    }
    // Resolve common libraries once, including releases with older embedded copies. Forge's
    // provider-present lane must prove the actual resolved combination; build pins alone do not.
    if (testCataclysm || testAether || testIronsSpells) {
        runtimeOnly fg.deobf("curse.maven:curios-309927:6418456") // Curios 5.14.1+1.20.1
    }
    if (testIronsSpells || testAoA) {
        runtimeOnly fg.deobf("curse.maven:geckolib-388172:5386948") // GeckoLib Forge 1.20.1 4.4.5
    }
    if (testCataclysm) {
        runtimeOnly fg.deobf("curse.maven:lionfish-api-1001614:8095554") // Lionfish API 3.0
        runtimeOnly fg.deobf("curse.maven:lendercataclysm-551586:8246047") // L_Ender's Cataclysm 3.31
    }
    if (testAether) {
        // This 1.20.1 release is explicitly listed for Forge AND NeoForge despite its suffix.
        // Nitrogen, Cumulus and MixinExtras are included in the official release archive.
        runtimeOnly fg.deobf("curse.maven:aether-255308:6134920") // Aether 1.20.1-1.5.2-neoforge
    }
    if (testIronsSpells) {
        runtimeOnly fg.deobf("curse.maven:caelus-308989:4581481") // Caelus 3.1.0+1.20
        // PlayerAnimator is already present above; never add a second animation-library artifact.
        runtimeOnly fg.deobf("curse.maven:irons-spells-n-spellbooks-855414:5765121") // 1.20.1-3.4.0.2
    }
    if (testAoA) {
        // Exact Forge 1.20.1 beta, not a later NeoForge-only release or the legacy full-dimension roster.
        // The all.jar also embeds SmartBrainLib 1.13, TslatEffectsLib 1.7 and HSQLDB 2.7.2.
        runtimeOnly fg.deobf("curse.maven:advent-of-ascension-nevermine-311054:4988685") // AoA 3.7.1
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.named('processResources', ProcessResources).configure {
    var p = [minecraft_version:minecraft_version, forge_version:forge_version, mod_id:mod_id,
             mod_name:mod_name, mod_version:mod_version, player_anim_version:player_anim_version]
    inputs.properties p
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand p + [project: project] }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-Xlint:deprecation']
}

jar {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest { attributes([
        'Specification-Title': mod_id,
        'Specification-Vendor': 'Herberto',
        'Specification-Version': '1',
        'Implementation-Title': project.name,
        'Implementation-Version': project.jar.archiveVersion,
        'Implementation-Vendor': 'Herberto',
        'MixinConfigs': 'jetsetcraft.liberty.mixins.json'
    ]) }
    finalizedBy 'reobfJar'
}
