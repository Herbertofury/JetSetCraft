plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods { jetsetcraft { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    mavenCentral()
    maven { name = 'KosmX'; url = 'https://maven.kosmx.dev/' }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("curse.maven:playeranimator-658587:4587214")
    implementation fg.deobf("curse.maven:geckolib-388172:8285794")

    // Compile against the current 1.20.1 TacZ API, but keep TacZ optional at runtime.
    compileOnly fg.deobf("curse.maven:timeless-and-classics-zero-1028108:8141310")

    // Create 6.0.8 (current Forge 1.20.1 release) is optional at runtime; this compiles the native track geometry adapter.
    compileOnly fg.deobf("curse.maven:create-328085:7178761")
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.named('processResources', ProcessResources).configure {
    var p = [minecraft_version:minecraft_version, forge_version:forge_version, mod_id:mod_id,
             mod_name:mod_name, mod_version:mod_version, player_anim_version:player_anim_version]
    inputs.properties p
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand p + [project: project] }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    manifest { attributes([
        'Specification-Title': mod_id,
        'Specification-Vendor': 'Herberto',
        'Specification-Version': '1',
        'Implementation-Title': project.name,
        'Implementation-Version': project.jar.archiveVersion,
        'Implementation-Vendor': 'Herberto'
    ]) }
    finalizedBy 'reobfJar'
}
