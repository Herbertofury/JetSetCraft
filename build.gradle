plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def wave2Provider = providers.gradleProperty('wave2Provider').orElse('').get().trim()

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            property 'jetsetcraft.wave2Provider', wave2Provider
            // Production provider jars ship SRG/refmap mixin targets. ForgeGradle's named userdev runtime
            // must remap those targets for GameTest/server verification; production Minecraft does not need this.
            if (!wave2Provider.isEmpty()) {
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', file("${buildDir}/createSrgToMcp/output.srg").absolutePath
            }
            mods { jetsetcraft { source sourceSets.main } }
        }
        client {
            // PlayerAnimator ships production (SRG) mixin targets; remap those targets in Forge's named dev runtime.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file("${buildDir}/createSrgToMcp/output.srg").absolutePath
            property 'jetsetcraft.visualAudit', System.getProperty('jetsetcraft.visualAudit', 'false')
            if (System.getProperty('jetsetcraft.visualAudit', 'false') == 'true') {
                args '--quickPlaySingleplayer', 'New World'
            }
        }
        server { args '--nogui' }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven { name = 'KosmX'; url = 'https://maven.kosmx.dev/' }
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net'
        content { includeGroup 'com.simibubi.create' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${player_anim_version}")

    // Create 6.0.8 is optional at runtime; the official slim artifact compiles the native track geometry adapter.
    compileOnly fg.deobf("com.simibubi.create:create-1.20.1:6.0.8-289:slim") { transitive = false }

    // Wave 2 provider-present verification is opt-in. These never enter JetSetCraft's normal runtime dependency set
    // or mods.toml, so production remains fully optional/fail-soft when the provider is absent.
    if (wave2Provider == 'alexsmobs') {
        runtimeOnly fg.deobf("curse.maven:citadel-331936:7476570") // Citadel 2.6.3, current 1.20.1 release
        runtimeOnly fg.deobf("curse.maven:alexs-mobs-426558:5698791") // Alex's Mobs 1.22.9
    } else if (wave2Provider == 'alexscaves') {
        runtimeOnly fg.deobf("curse.maven:citadel-331936:7476570") // Citadel 2.6.3; Alex's Caves requires >=2.6.0
        runtimeOnly fg.deobf("curse.maven:alexs-caves-924854:5848216") // Alex's Caves 2.0.2
    } else if (wave2Provider == 'cataclysm') {
        runtimeOnly fg.deobf("curse.maven:curios-309927:6418456") // Curios 5.14.1+1.20.1
        runtimeOnly fg.deobf("curse.maven:lionfish-api-1001614:8095554") // Lionfish API 3.0
        runtimeOnly fg.deobf("curse.maven:lendercataclysm-551586:8246047") // L_Ender's Cataclysm 3.31
    } else if (!wave2Provider.isEmpty()) {
        throw new GradleException("Unknown -Pwave2Provider=" + wave2Provider)
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.named('processResources', ProcessResources).configure {
    var p = [minecraft_version:minecraft_version, forge_version:forge_version, mod_id:mod_id,
             mod_name:mod_name, mod_version:mod_version, player_anim_version:player_anim_version]
    inputs.properties p
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand p + [project: project] }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-Xlint:deprecation']
}

jar {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest { attributes([
        'Specification-Title': mod_id,
        'Specification-Vendor': 'Herberto',
        'Specification-Version': '1',
        'Implementation-Title': project.name,
        'Implementation-Version': project.jar.archiveVersion,
        'Implementation-Vendor': 'Herberto'
    ]) }
    finalizedBy 'reobfJar'
}
