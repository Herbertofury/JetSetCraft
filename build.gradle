plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods { jetsetcraft { source sourceSets.main } }
        }
        client {
            // PlayerAnimator ships production (SRG) mixin targets; remap those targets in Forge's named dev runtime.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file("${buildDir}/createSrgToMcp/output.srg").absolutePath
            property 'jetsetcraft.visualAudit', System.getProperty('jetsetcraft.visualAudit', 'false')
            if (System.getProperty('jetsetcraft.visualAudit', 'false') == 'true') {
                args '--quickPlaySingleplayer', 'New World'
            }
        }
        server { args '--nogui' }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

repositories {
    mavenCentral()
    maven { name = 'KosmX'; url = 'https://maven.kosmx.dev/' }
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net'
        content { includeGroup 'com.simibubi.create' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${player_anim_version}")

    // Create 6.0.8 is optional at runtime; the official slim artifact compiles the native track geometry adapter.
    compileOnly fg.deobf("com.simibubi.create:create-1.20.1:6.0.8-289:slim") { transitive = false }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.named('processResources', ProcessResources).configure {
    var p = [minecraft_version:minecraft_version, forge_version:forge_version, mod_id:mod_id,
             mod_name:mod_name, mod_version:mod_version, player_anim_version:player_anim_version]
    inputs.properties p
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand p + [project: project] }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-Xlint:deprecation']
}

jar {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest { attributes([
        'Specification-Title': mod_id,
        'Specification-Vendor': 'Herberto',
        'Specification-Version': '1',
        'Implementation-Title': project.name,
        'Implementation-Version': project.jar.archiveVersion,
        'Implementation-Vendor': 'Herberto'
    ]) }
    finalizedBy 'reobfJar'
}
