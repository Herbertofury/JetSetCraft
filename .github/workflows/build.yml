name: Verify JetSetCraft

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jetsetcraft-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 17 / Forge 1.20.1
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up Temurin 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle wrapper cache
        uses: gradle/actions/setup-gradle@v6

      - name: Set up asset tooling
        run: python -m pip install --requirement tools/requirements.txt

      - name: Regenerate deterministic authored assets
        run: |
          python tools/generate_models.py
          python tools/generate_animations.py
          python tools/generate_brand.py

      - name: Validate assets, gameplay contracts, source, and wiki
        run: |
          python tools/validate_assets.py
          python tools/validate_gameplay_contract.py
          python tools/validate_java_syntax.py
          python tools/validate_premium_polish.py
          python tools/validate_wiki.py
          python -m compileall -q tools
          git diff --check
          git diff --exit-code

      - name: Clean Forge build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew clean build --no-daemon; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo '::error::Forge build failed after three attempts.'
              exit 1
            fi
            echo "::warning::Forge dependency service/build attempt $attempt failed; retrying in 20 seconds."
            sleep 20
          done

      - name: Run nine real Forge GameTests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/verification
          log=build/verification/gametest.log
          timeout 240s ./gradlew runGameTestServer --no-daemon | tee "$log"
          for marker in \
            'JETSETCRAFT_GAMETEST_PASS hoverboard' \
            'JETSETCRAFT_GAMETEST_PASS ride_controls' \
            'JETSETCRAFT_GAMETEST_PASS scooter' \
            'JETSETCRAFT_GAMETEST_PASS dance_flow' \
            'JETSETCRAFT_GAMETEST_PASS combat_sovereignty' \
            'JETSETCRAFT_GAMETEST_PASS catalogs' \
            'JETSETCRAFT_GAMETEST_PASS street_gear' \
            'JETSETCRAFT_GAMETEST_PASS graffiti_lifecycle' \
            'JETSETCRAFT_GAMETEST_PASS paint_balloon_splash'; do
            grep -Fq "$marker" "$log" || { echo "::error::Missing GameTest marker: $marker"; exit 1; }
          done
          grep -Eq 'All 9 required tests passed|9 tests? passed' "$log" || {
            echo '::error::Forge did not report all nine GameTests passing.'
            exit 1
          }

      - name: Run real Forge dedicated-server smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run build/verification
          printf 'eula=true\n' > run/eula.txt
          log=build/verification/server-smoke.log
          set +e
          timeout 180s ./gradlew runServer --no-daemon > "$log" 2>&1
          exit_code=$?
          set -e
          cat "$log"
          grep -Eq 'Done \([0-9.]+s\)!' "$log" || {
            echo '::error::Forge dedicated server never reached ready state.'
            exit "${exit_code:-1}"
          }
          if grep -Eiq 'ModLoadingException|Failed to complete lifecycle event|Exception in thread "main"|FATAL.*jetsetcraft' "$log"; then
            echo '::error::A fatal JetSetCraft/mod-loading error occurred.'
            exit 1
          fi

      - name: Seal artifact checksums
        shell: bash
        run: |
          cd build/libs
          sha256sum *.jar > SHA256SUMS
          test -s SHA256SUMS

      - name: Upload verified release candidate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jetsetcraft-forge-1.20.1-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/libs/SHA256SUMS
            build/verification/*.log
          if-no-files-found: warn
