name: Verify JetSetCraft

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jetsetcraft-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 17 / Forge 1.20.1
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up Temurin 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle wrapper cache
        uses: gradle/actions/setup-gradle@v6

      - name: Set up asset tooling
        run: python -m pip install --requirement tools/requirements.txt

      - name: Regenerate deterministic authored assets
        run: |
          python tools/generate_models.py
          python tools/generate_animations.py
          python tools/generate_brand.py

      - name: Validate assets, gameplay contracts, source, and wiki
        run: |
          python tools/validate_assets.py
          python tools/validate_gameplay_contract.py
          python tools/validate_java_syntax.py
          python tools/validate_premium_polish.py
          python tools/validate_wave2_compat.py
          python tools/validate_wiki.py
          python tools/build_research_browser.py --check
          node tools/test_research_browser.js
          python -m compileall -q tools
          git diff --check
          git diff --exit-code

      - name: Clean Forge build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/jetsetcraft-forge-build-attempt-$attempt.log"
            if ./gradlew clean build --no-daemon 2>&1 | tee "$log"; then
              mkdir -p build/verification
              cp "$log" "build/verification/forge-build-attempt-$attempt.log"
              exit 0
            fi
            mkdir -p build/verification
            cp "$log" "build/verification/forge-build-attempt-$attempt.log"
            if grep -Eq 'Compilation failed|> Task :compile(Java|TestJava) FAILED|(^|[[:space:]])error:' "$log"; then
              echo '::error::Deterministic compile failure; refusing an unchanged retry.'
              exit 1
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo '::error::Forge build failed after three evidence-changing attempts.'
              exit 1
            fi
            echo "::warning::Possible transient dependency/service build failure on attempt $attempt; retrying once state can change."
            sleep 20
          done

      - name: Run all real Forge GameTests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/verification
          log=build/verification/gametest.log
          timeout 240s ./gradlew runGameTestServer --no-daemon | tee "$log"
          for marker in \
            'JETSETCRAFT_GAMETEST_PASS hoverboard' \
            'JETSETCRAFT_GAMETEST_PASS ride_controls' \
            'JETSETCRAFT_GAMETEST_PASS scooter' \
            'JETSETCRAFT_GAMETEST_PASS dance_flow' \
            'JETSETCRAFT_GAMETEST_PASS combat_sovereignty' \
            'JETSETCRAFT_GAMETEST_PASS catalogs' \
            'JETSETCRAFT_GAMETEST_PASS street_gear' \
            'JETSETCRAFT_GAMETEST_PASS graffiti_lifecycle' \
            'JETSETCRAFT_GAMETEST_PASS paint_balloon_splash' \
            'JETSETCRAFT_GAMETEST_PASS rush_rules' \
            'JETSETCRAFT_GAMETEST_PASS rush_album' \
            'JETSETCRAFT_GAMETEST_PASS rush_return' \
            'JETSETCRAFT_GAMETEST_PASS rush_session' \
            'JETSETCRAFT_GAMETEST_PASS rush_ownership' \
            'JETSETCRAFT_GAMETEST_PASS rush_objectives' \
            'JETSETCRAFT_GAMETEST_PASS crew_house' \
            'JETSETCRAFT_GAMETEST_PASS crew_missions' \
            'JETSETCRAFT_GAMETEST_PASS crew_persistence' \
            'JETSETCRAFT_GAMETEST_PASS crew_rush' \
            'JETSETCRAFT_GAMETEST_PASS activity_progression' \
            'JETSETCRAFT_GAMETEST_PASS activity_tag' \
            'JETSETCRAFT_GAMETEST_PASS activity_safety' \
            'JETSETCRAFT_GAMETEST_PASS activity_hill' \
            'JETSETCRAFT_GAMETEST_PASS rush_spell_relay' \
            'JETSETCRAFT_GAMETEST_PASS activity_dimension_return' \
            'JETSETCRAFT_GAMETEST_PASS rush_arena_catalogue' \
            'JETSETCRAFT_GAMETEST_PASS rush_arena_rules' \
            'JETSETCRAFT_GAMETEST_PASS rush_arena_session' \
            'JETSETCRAFT_GAMETEST_PASS rush_build_rules' \
            'JETSETCRAFT_GAMETEST_PASS rush_build_runtime' \
            'JETSETCRAFT_GAMETEST_PASS rush_journey_preview' \
            'JETSETCRAFT_GAMETEST_PASS rush_journey_history' \
            'JETSETCRAFT_GAMETEST_PASS crew_progress_history' \
            'JETSETCRAFT_GAMETEST_PASS crew_progress_caps' \
            'JETSETCRAFT_GAMETEST_PASS crew_progress_mission' \
            'JETSETCRAFT_GAMETEST_PASS rush_synergy_rules' \
            'JETSETCRAFT_GAMETEST_PASS rush_synergy_control' \
            'JETSETCRAFT_GAMETEST_PASS rush_synergy_recovery' \
            'JETSETCRAFT_GAMETEST_PASS rush_cache_options' \
            'JETSETCRAFT_GAMETEST_PASS rush_cache_boundaries' \
            'JETSETCRAFT_GAMETEST_PASS rush_route_exploration' \
            'JETSETCRAFT_GAMETEST_PASS crew_style_shared_rewards' \
            'JETSETCRAFT_GAMETEST_PASS crew_style_persistence' \
            'JETSETCRAFT_GAMETEST_PASS crew_style_entry'; do
            grep -Fq "$marker" "$log" || { echo "::error::Missing GameTest marker: $marker"; exit 1; }
          done
          expected_tests=$(python -c "import pathlib,re; print(sum(len(re.findall(r'@GameTest\\s*\\(', p.read_text()) ) for p in pathlib.Path('src/main/java/com/herberto/jetsetcraft/gametest').glob('*.java')))")
          grep -Eq "All ${expected_tests} required tests passed|${expected_tests} tests? passed" "$log" || {
            echo '::error::Forge did not report every declared GameTest passing.'
            exit 1
          }
          grep -Fq 'JETSETCRAFT_GAMETEST_STYLE_RELAY provider_absent' "$log"

      - name: Run real Forge dedicated-server smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run build/verification
          printf 'eula=true\n' > run/eula.txt
          export JETSETCRAFT_SMOKE_RCON_PASSWORD="$(python -c 'import secrets; print(secrets.token_hex(24))')"
          printf 'server-ip=127.0.0.1\nenable-rcon=true\nrcon.port=25575\nrcon.password=%s\nbroadcast-rcon-to-ops=false\n' \
            "$JETSETCRAFT_SMOKE_RCON_PASSWORD" > run/server.properties
          log=build/verification/server-smoke.log
          : > "$log"
          setsid ./gradlew runServer --no-daemon > "$log" 2>&1 &
          server_pid=$!
          ready=0
          deadline=$((SECONDS + 120))
          while kill -0 "$server_pid" 2>/dev/null; do
            if grep -Eq 'Done \([0-9.]+s\)!' "$log"; then
              ready=1
              break
            fi
            if grep -Eiq 'ModLoadingException|Failed to complete lifecycle event|Exception in thread "main"|FATAL.*jetsetcraft' "$log"; then
              break
            fi
            if (( SECONDS >= deadline )); then
              break
            fi
            sleep 2
          done
          cat "$log"
          if [[ "$ready" -ne 1 ]]; then
            kill -TERM -- "-$server_pid" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            echo '::error::Forge dedicated server never reached ready state.'
            exit 1
          fi
          if grep -Eiq 'ModLoadingException|Failed to complete lifecycle event|Exception in thread "main"|FATAL.*jetsetcraft' "$log"; then
            kill -TERM -- "-$server_pid" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            echo '::error::A fatal JetSetCraft/mod-loading error occurred.'
            exit 1
          fi
          if ! python tools/stop_smoke_server.py; then
            kill -TERM -- "-$server_pid" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            tail -n 80 "$log"
            echo '::error::Could not request a normal Minecraft stop over loopback RCON.'
            exit 1
          fi
          shutdown_complete=0
          shutdown_deadline=$((SECONDS + 30))
          while (( SECONDS < shutdown_deadline )); do
            if ! kill -0 "$server_pid" 2>/dev/null \
                && grep -Fq 'All dimensions are saved' "$log"; then
              shutdown_complete=1
              break
            fi
            sleep 1
          done
          if [[ "$shutdown_complete" -ne 1 ]]; then
            kill -KILL -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            tail -n 80 "$log"
            echo '::error::Forge did not finish a graceful world save and shutdown within 30 seconds.'
            exit 1
          fi
          if ! wait "$server_pid"; then
            echo '::error::Forge launcher exited unsuccessfully after the normal stop.'
            exit 1
          fi
          test -s run/world/level.dat

      - name: Verify activities, arena journeys and crew houses in a real Minecraft client
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          mkdir -p run/saves/RivalRushAudit build/verification
          test -s run/world/level.dat
          cp -a run/world/. run/saves/RivalRushAudit/
          test -s run/saves/RivalRushAudit/level.dat
          collect_client_captures() {
            shopt -s nullglob
            captures=(run/screenshots/rival-rush-*.png)
            if (( ${#captures[@]} )); then
              cp "${captures[@]}" build/verification/
            fi
          }
          trap collect_client_captures EXIT
          log=build/verification/rush-client.log
          timeout 300s xvfb-run -a -s '-screen 0 1280x720x24' ./gradlew runClient -Djetsetcraft.rushVisualAudit=true --no-daemon 2>&1 | tee "$log"
          grep -Fq 'JETSETCRAFT_RUSH_VISUAL_AUDIT_PASS' "$log"
          grep -Fq 'JETSETCRAFT_CREW_VISUAL_AUDIT_PASS' "$log"
          grep -Fq 'JETSETCRAFT_ACTIVITY_VISUAL_AUDIT_PASS' "$log"
          grep -Fq 'JETSETCRAFT_RUSH_VISUAL_AUDIT_FIXTURE_OBSERVED' "$log"
          if grep -Fq 'JETSETCRAFT_RUSH_VISUAL_AUDIT_FAIL' "$log"; then
            echo '::error::Rival Rush client audit reported failure.'
            exit 1
          fi
          for capture in 01-setup 02-district-hud 03-album 04-return-result 05-crew-home 06-crew-roster 07-crew-facilities 08-crew-jobs 09-activities 10-arena-route 11-journey-map 12-run-build 13-crew-progress 14-cache-scout 15-style-library; do
            grep -Fq "JETSETCRAFT_RUSH_VISUAL_AUDIT_CAPTURE $capture " "$log"
            compgen -G "run/screenshots/rival-rush-*-$capture.png" >/dev/null
          done

      - name: Seal artifact checksums
        shell: bash
        run: |
          cd build/libs
          sha256sum *.jar > SHA256SUMS
          test -s SHA256SUMS

      - name: Upload verified release candidate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jetsetcraft-forge-1.20.1-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/libs/SHA256SUMS
            build/verification/*.log
            build/verification/*.png
          if-no-files-found: warn
