name: Build JetSetCraft
permissions:
  contents: write
on:
  push:
    branches: [ main, jetsetcraft, jetsetcraft-alpha, 'automation/**' ]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Apply pending verified-source checkpoint
        id: pending
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(checkpoints/style-flow-pending.b64.part*)
          if (( ${#parts[@]} == 0 )); then
            echo 'applied=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat "${parts[@]}" | base64 --decode | xz -dc > /tmp/style-flow.patch
          git apply --index --whitespace=nowarn /tmp/style-flow.patch
          rm -f checkpoints/style-flow-pending.b64.part*
          git add -A
          echo 'applied=true' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Generate and validate authored assets and gameplay contract
        run: |
          set -euo pipefail
          python -m pip install -r tools/requirements.txt
          python tools/generate_models.py
          python tools/generate_animations.py
          python tools/generate_brand.py
          python tools/validate_assets.py
          python tools/validate_gameplay_contract.py
          python tools/validate_wiki.py
      - name: Package exact staged source snapshot
        run: |
          set -euo pipefail
          git add -A
          tree_sha="$(git write-tree)"
          git archive --format=zip --output=jetsetcraft-source.zip "$tree_sha"
      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: jetsetcraft-source
          path: jetsetcraft-source.zip
          if-no-files-found: error
      - name: Build
        run: gradle --no-daemon build
      - name: Real Forge GameTest Style Flow acceptance
        shell: bash
        run: |
          set -euo pipefail
          rm -f style-flow-gametest.log
          timeout 180s gradle --no-daemon runGameTestServer | tee style-flow-gametest.log
          for required in \
            hoverboardusespersistentuniversalridesolver \
            scooterusesuniversalpersistentridesolver \
            breakdancestartswithoutridegearandbuildsstyle; do
            if ! tr '[:upper:]' '[:lower:]' < style-flow-gametest.log | grep -q "$required"; then
              echo "::error::Forge GameTest did not visibly execute $required."
              exit 1
            fi
          done
          if ! grep -Eq 'All 3 required tests passed|3 tests? passed' style-flow-gametest.log; then
            echo '::error::Forge GameTest server did not report all three required Style Flow tests passing.'
            exit 1
          fi
      - name: Upload Style Flow GameTest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jetsetcraft-style-flow-gametest
          path: style-flow-gametest.log
          if-no-files-found: warn
      - name: Real Forge dedicated-server runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          rm -f server-smoke.log
          set +e
          timeout 180s gradle --no-daemon runServer > server-smoke.log 2>&1
          exit_code=$?
          set -e
          cat server-smoke.log
          if ! grep -Eq 'Done \([0-9.]+s\)!|Done \([0-9.]+s\)! For help' server-smoke.log; then
            echo '::error::Forge dedicated server never reached the ready state.'
            exit "${exit_code:-1}"
          fi
          if grep -Eiq 'ModLoadingException|Failed to complete lifecycle event|Exception in thread "main"|FATAL.*jetsetcraft' server-smoke.log; then
            echo '::error::JetSetCraft produced a fatal/mod-loading error before or during server startup.'
            exit 1
          fi
          echo 'JetSetCraft reached the real Forge dedicated-server ready state.'
      - name: Upload runtime smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jetsetcraft-forge-server-smoke
          path: server-smoke.log
          if-no-files-found: warn
      - name: Upload approved full-quality cover
        uses: actions/upload-artifact@v4
        with:
          name: jetsetcraft-approved-cover
          path: assets/jetsetcraft-cover.webp
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: jetsetcraft-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Publish verified JetSetCraft wiki
        if: steps.pending.outputs.applied == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          git clone "$remote" /tmp/jetsetcraft-wiki
          rsync -a --delete --exclude '.git' wiki/ /tmp/jetsetcraft-wiki/
          cd /tmp/jetsetcraft-wiki
          git config user.name 'JetSetCraft Wiki Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Wiki already matches the validated source.'
          else
            git commit -m "Publish verified Style Flow wiki for ${GITHUB_SHA::12}"
            branch="$(git branch --show-current)"
            git push origin "HEAD:${branch:-master}"
          fi
      - name: Promote verified Style Flow source checkpoint
        if: steps.pending.outputs.applied == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'JetSetCraft Verification Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Add verified JetSetCraft Style Flow expansion'
          target_branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin HEAD:"$target_branch"
