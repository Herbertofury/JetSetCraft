name: Build JetSetCraft
on:
  push:
    branches: [ main, jetsetcraft, jetsetcraft-alpha, 'automation/**' ]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Generate and validate authored assets and gameplay contract
        run: |
          set -euo pipefail
          python -m pip install -r tools/requirements.txt
          python tools/generate_models.py
          python tools/generate_hoverboard.py
          python tools/generate_brand.py
          python tools/validate_assets.py
          python tools/validate_gameplay_contract.py
      - name: Build
        run: gradle --no-daemon build
      - name: Real Forge GameTest hoverboard acceptance
        shell: bash
        run: |
          set -euo pipefail
          rm -f hoverboard-gametest.log
          timeout 180s gradle --no-daemon runGameTestServer | tee hoverboard-gametest.log
          if ! grep -Eq '1 tests are now running|1 test is now running|Running test|hoverboardUsesPersistentUniversalRideSolver|hoverboardusespersistentuniversalridesolver' hoverboard-gametest.log; then
            echo '::error::Forge GameTest server did not visibly execute the recovered hoverboard test.'
            exit 1
          fi
      - name: Upload hoverboard GameTest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jetsetcraft-hoverboard-gametest
          path: hoverboard-gametest.log
          if-no-files-found: warn
      - name: Real Forge dedicated-server runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          rm -f server-smoke.log
          set +e
          timeout 180s gradle --no-daemon runServer > server-smoke.log 2>&1
          exit_code=$?
          set -e
          cat server-smoke.log
          if ! grep -Eq 'Done \([0-9.]+s\)!|Done \([0-9.]+s\)! For help' server-smoke.log; then
            echo '::error::Forge dedicated server never reached the ready state.'
            exit "${exit_code:-1}"
          fi
          if grep -Eiq 'ModLoadingException|Failed to complete lifecycle event|Exception in thread "main"|FATAL.*jetsetcraft' server-smoke.log; then
            echo '::error::JetSetCraft produced a fatal/mod-loading error before or during server startup.'
            exit 1
          fi
          echo 'JetSetCraft reached the real Forge dedicated-server ready state.'
      - name: Upload runtime smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jetsetcraft-forge-server-smoke
          path: server-smoke.log
          if-no-files-found: warn
      - name: Upload approved full-quality cover
        uses: actions/upload-artifact@v4
        with:
          name: jetsetcraft-approved-cover
          path: assets/jetsetcraft-cover.webp
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: jetsetcraft-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
