name: Publish staged JetSetCraft source

on:
  push:
    branches: [ main ]
    paths:
      - '.bootstrap/cc65cad/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand exact source checkpoint
        shell: bash
        run: |
          cat .bootstrap/cc65cad/chunk-* | base64 -d > /tmp/jetsetcraft-src.tar.gz
          echo "778627d230fd9f1ce87a7031e66dd928556ac4f84cd08089d41ca3871ea96ecc  /tmp/jetsetcraft-src.tar.gz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .bootstrap -exec rm -rf {} +
          tar -xzf /tmp/jetsetcraft-src.tar.gz
          rm -rf .bootstrap
      - name: Commit normal source tree
        shell: bash
        run: |
          git config user.name "JetSetCraft Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Publish JetSetCraft cc65cad source checkpoint"
          git push origin HEAD:main
