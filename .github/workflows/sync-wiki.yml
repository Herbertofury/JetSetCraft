name: Publish JetSetCraft Wiki

on:
  push:
    branches: [ main ]
    paths:
      - 'wiki/**'
      - 'tools/validate_wiki.py'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jetsetcraft-wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate complete wiki
        run: python tools/validate_wiki.py
      - name: Publish exact wiki tree and record receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          rm -rf /tmp/jetsetcraft-wiki
          git clone "$remote" /tmp/jetsetcraft-wiki
          rsync -a --delete --exclude '.git' wiki/ /tmp/jetsetcraft-wiki/
          cd /tmp/jetsetcraft-wiki
          git config user.name 'JetSetCraft Wiki Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Wiki already matches the validated repository source.'
          else
            git commit -m "Publish JetSetCraft wiki for ${GITHUB_SHA::12}"
            branch="$(git branch --show-current)"
            git push origin "HEAD:${branch:-master}"
          fi
          wiki_commit="$(git rev-parse HEAD)"
          wiki_branch="$(git branch --show-current)"

          cd "$GITHUB_WORKSPACE"

          # The wiki publication may overlap unrelated main-branch commits. Base the receipt on the
          # latest main tip instead of the workflow's original checkout so a successful wiki publish
          # can never fail merely because main advanced while the wiki was being cloned/pushed.
          git fetch origin main
          git checkout -B main origin/main

          write_receipt() {
            python - "$wiki_commit" "$wiki_branch" <<'PY'
          import datetime
          import json
          import pathlib
          import sys

          wiki_commit, wiki_branch = sys.argv[1:]
          pages = sorted(path.name for path in pathlib.Path('wiki').glob('*.md'))
          receipt = {
              'schema': 1,
              'source_commit': '${{ github.sha }}',
              'wiki_commit': wiki_commit,
              'wiki_branch': wiki_branch or 'master',
              'page_count': len(pages),
              'pages': pages,
              'validated': True,
              'published_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'url': 'https://github.com/${{ github.repository }}/wiki',
          }
          target = pathlib.Path('.agents-memory/WIKI_PUBLICATION.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          PY
          }

          write_receipt
          git config user.name 'JetSetCraft Wiki Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .agents-memory/WIKI_PUBLICATION.json
          if git diff --cached --quiet; then
            echo 'Wiki publication receipt is already current.'
            exit 0
          fi
          git commit -m "Record published JetSetCraft wiki ${wiki_commit:0:12}"

          # If main advances again between fetch and push, rebase the single receipt commit and retry.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo '::error::Wiki was published, but the publication receipt could not be synchronized to main.'
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
            sleep 2
          done
