name: Recover JetSetCraft a3843e0 edge hardening

on:
  push:
    branches:
      - automation/recover-a3843e0-edge-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Reconstruct preserved a3843e0 split source archive
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin jetsetcraft-alpha-current --depth=20
          archive_b64="$RUNNER_TEMP/jetsetcraft-a3843e0.b64"
          archive_tgz="$RUNNER_TEMP/jetsetcraft-a3843e0.tar.gz"
          historical_root="$RUNNER_TEMP/jetsetcraft-a3843e0-src"
          : > "$archive_b64"
          for piece in \
            .bootstrap/current/chunk-00 \
            .bootstrap/current/chunk-01 \
            .bootstrap/current/chunk-02 \
            .bootstrap/current/chunk-03 \
            .bootstrap/current/chunk-04 \
            bootstrap/jetsetcraft-alpha-src.tar.gz.b64 \
            .bootstrap/current/chunk-06 \
            .bootstrap/current/chunk-07 \
            .bootstrap/current/chunk-08; do
            git show "origin/jetsetcraft-alpha-current:$piece" >> "$archive_b64"
            printf '\n' >> "$archive_b64"
          done
          base64 --decode --ignore-garbage "$archive_b64" > "$archive_tgz"
          tar -tzf "$archive_tgz" >/dev/null
          mkdir -p "$historical_root"
          tar -xzf "$archive_tgz" -C "$historical_root"
          printf 'HISTORICAL_ROOT=%s\n' "$historical_root" >> "$GITHUB_ENV"
          printf 'Recovered split source archive: %s bytes\n' "$(stat -c %s "$archive_tgz")"
          find "$historical_root" -type f \( -name 'RideLoadout.java' -o -name 'C2SRideLoadoutPacket.java' -o -name 'ClientEvents.java' -o -name 'JetSetNetwork.java' \) -print

      - name: Restore omitted checkpoint source and edge steering hunk
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          test -f checkpoints/JetSetCraft-a3843e0.patch
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          root = Path('.')
          historical_root = Path(os.environ['HISTORICAL_ROOT'])
          changed = False

          def historical(rel: str) -> Path:
              matches = list(historical_root.rglob(rel))
              if len(matches) != 1:
                  raise SystemExit(f'Expected exactly one historical {rel}, found {len(matches)}: {matches}')
              return matches[0]

          # The interrupted source publication omitted entire new Java files from the checkpoint. Restore only
          # files that are absent in the current recovered tree; never overwrite an existing newer source file.
          for rel in [
              'src/main/java/com/herberto/jetsetcraft/item/RideLoadout.java',
              'src/main/java/com/herberto/jetsetcraft/network/C2SRideLoadoutPacket.java',
          ]:
              dst = root / rel
              if not dst.exists():
                  src = historical(rel)
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
                  print(f'restored missing source: {rel}')
                  changed = True

          movement_path = root / 'src/main/java/com/herberto/jetsetcraft/movement/JetSetMovement.java'
          movement = movement_path.read_text(encoding='utf-8')
          old = '''        if (data.grindKind().rail()) {
              Vec3 desired = desiredDirection(player, data);
              if (desired.lengthSqr() > 0.05) {
                  // Steering input biases junction selection without instantly rotating away from the current rail.
                  preferred = safeNormalize(preferred.scale(0.82).add(desired.normalize().scale(0.44)), preferred);
              }
          }
'''
          new = '''        Vec3 desired = desiredDirection(player, data);
          if (desired.lengthSqr() > 0.05) {
              if (data.grindKind().rail()) {
                  // Rail input biases switches/junctions without snapping the rider away from the current track.
                  preferred = safeNormalize(preferred.scale(0.82).add(desired.normalize().scale(0.44)), preferred);
              } else if (data.grindKind() == GrindKind.EDGE) {
                  // Exposed world edges need stronger intentional steering so a fence/wall/ledge can take a
                  // real 90-degree corner. With no input the current tangent still wins, so corners remain skillful.
                  preferred = safeNormalize(preferred.scale(0.58).add(desired.normalize().scale(0.82)), preferred);
              }
          }
'''
          if 'data.grindKind() == GrindKind.EDGE' not in movement:
              if old not in movement:
                  raise SystemExit('Current JetSetMovement steering anchor differs from both preserved old and recovered forms')
              movement_path.write_text(movement.replace(old, new, 1), encoding='utf-8')
              changed = True

          checks = {
              root / 'docs/VANILLA_WORLD_MECHANICS_SYNERGY.md': ['## Exposed-world edge solver hardening'],
              root / 'src/main/java/com/herberto/jetsetcraft/command/JetSetCommands.java': ['buildGeometryLane', 'Blocks.IRON_BARS', 'Blocks.OAK_LOG'],
              root / 'src/main/java/com/herberto/jetsetcraft/movement/EdgeFinder.java': ['usableExposedEdge', 'sideProbeFree', 'noCollision(player, clearance)'],
              movement_path: ['data.grindKind() == GrindKind.EDGE', 'preferred.scale(0.58)'],
              root / 'tools/validate_gameplay_contract.py': ['shape-driven exposed-edge validation', 'edge grinding lacks intentional 90-degree corner steering bias', 'Blocks.GLASS_PANE'],
              root / 'src/main/java/com/herberto/jetsetcraft/item/RideLoadout.java': ['equipFromHand', 'returnToPlayer', 'dropEquipped'],
              root / 'src/main/java/com/herberto/jetsetcraft/network/C2SRideLoadoutPacket.java': ['C2SRideLoadoutPacket'],
          }
          for path, needles in checks.items():
              if not path.exists():
                  raise SystemExit(f'Missing recovered source file: {path}')
              text = path.read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'Missing recovered a3843e0 marker {needle!r} in {path}')

          Path('.a3843e0_changed').write_text('true\n' if changed else 'false\n', encoding='utf-8')
          PY
          echo "applied=$(tr -d '\r\n' < .a3843e0_changed)" >> "$GITHUB_OUTPUT"
          rm .a3843e0_changed
          git diff --check

      - name: Generate and validate authored assets and gameplay contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tools/requirements.txt
          python tools/generate_models.py
          python tools/generate_brand.py
          python tools/validate_assets.py
          python tools/validate_gameplay_contract.py

      - name: Build exact recovered Forge project
        run: gradle --no-daemon build

      - name: Real Forge dedicated-server runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          rm -f a3843e0-server-smoke.log
          set +e
          timeout 180s gradle --no-daemon runServer > a3843e0-server-smoke.log 2>&1
          exit_code=$?
          set -e
          cat a3843e0-server-smoke.log
          if ! grep -Eq 'Done \([0-9.]+s\)!|Done \([0-9.]+s\)! For help' a3843e0-server-smoke.log; then
            echo '::error::Forge dedicated server never reached ready state on the recovered source.'
            exit "${exit_code:-1}"
          fi
          if grep -Eiq 'ModLoadingException|Failed to complete lifecycle event|Exception in thread "main"|FATAL.*jetsetcraft' a3843e0-server-smoke.log; then
            echo '::error::JetSetCraft produced a fatal/mod-loading error.'
            exit 1
          fi

      - name: Record exact artifact identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/a3843e0
          cp a3843e0-server-smoke.log output/a3843e0/
          cp build/libs/*.jar output/a3843e0/
          sha256sum checkpoints/JetSetCraft-a3843e0.patch > output/a3843e0/patch.sha256
          sha256sum output/a3843e0/*.jar > output/a3843e0/jars.sha256
          sha256sum output/a3843e0/a3843e0-server-smoke.log > output/a3843e0/server-log.sha256
          git rev-parse HEAD > output/a3843e0/precommit-head.txt
          git diff --stat > output/a3843e0/recovery-diff-stat.txt

      - name: Publish verified recovered source to recovery branch
        if: steps.patch.outputs.applied == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JetSetCraft Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A src/main/java/com/herberto/jetsetcraft tools/validate_gameplay_contract.py docs/VANILLA_WORLD_MECHANICS_SYNERGY.md
          git diff --cached --check
          git commit -m 'Recover verified a3843e0 source omissions'
          git push origin HEAD:automation/recover-a3843e0-edge-hardening

      - name: Upload exact recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jetsetcraft-a3843e0-recovery
          path: output/a3843e0
          if-no-files-found: warn

      - name: Upload recovered Forge build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jetsetcraft-a3843e0-forge-build
          path: build/libs/*.jar
          if-no-files-found: error
