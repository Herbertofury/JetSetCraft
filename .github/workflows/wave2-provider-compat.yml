name: Verify Wave 2 Providers

on:
  push:
    branches: [main]
    paths:
      - "build.gradle"
      - "gradle.properties"
      - "src/main/java/com/herberto/jetsetcraft/mob/**"
      - "src/main/java/com/herberto/jetsetcraft/gang/**"
      - "src/main/java/com/herberto/jetsetcraft/gametest/StreetGearGameTests.java"
      - "src/main/resources/data/jetsetcraft/jetsetcraft_gangs/wave2_*.json"
      - "tools/validate_wave2_compat.py"
      - ".github/workflows/wave2-provider-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jetsetcraft-wave2-providers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider:
    name: ${{ matrix.provider }} / Forge 1.20.1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        provider: [alexsmobs, alexscaves, cataclysm]

    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up Temurin 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle wrapper cache
        uses: gradle/actions/setup-gradle@v6

      - name: Validate exact Wave 2 manifests
        run: python tools/validate_wave2_compat.py

      - name: Build with pinned provider present
        shell: bash
        run: ./gradlew clean build -Pwave2Provider=${{ matrix.provider }} --no-daemon

      - name: Run real Forge GameTests with provider present
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/verification
          log="build/verification/wave2-${{ matrix.provider }}-gametest.log"
          timeout 360s ./gradlew runGameTestServer -Pwave2Provider=${{ matrix.provider }} --no-daemon | tee "$log"
          grep -Fq 'JETSETCRAFT_GAMETEST_PASS street_gear' "$log" || {
            echo "::error::Wave 2 Street Gear/compatibility GameTest did not pass for ${{ matrix.provider }}."
            exit 1
          }
          grep -Eq 'All 9 required tests passed|9 tests? passed' "$log" || {
            echo "::error::Forge did not report all nine JetSetCraft GameTests passing for ${{ matrix.provider }}."
            exit 1
          }
          case "${{ matrix.provider }}" in
            alexsmobs)
              grep -Fq 'JetSetCraft compatibility alexsmobs -> READY (90/90 known safe ids, 7 hidden technical ids)' "$log"
              ;;
            alexscaves)
              grep -Fq 'JetSetCraft compatibility alexscaves -> READY (43/43 known safe ids, 2 hidden technical ids)' "$log"
              ;;
            cataclysm)
              grep -Fq 'JetSetCraft compatibility cataclysm -> READY (39/39 known safe ids, 0 hidden technical ids)' "$log"
              ;;
          esac

      - name: Run dedicated-server smoke with provider present
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run build/verification
          printf 'eula=true\n' > run/eula.txt
          log="build/verification/wave2-${{ matrix.provider }}-server.log"
          set +e
          timeout 240s ./gradlew runServer -Pwave2Provider=${{ matrix.provider }} --no-daemon > "$log" 2>&1
          exit_code=$?
          set -e
          cat "$log"
          grep -Eq 'Done \([0-9.]+s\)!' "$log" || {
            echo "::error::Provider-present server never reached ready state for ${{ matrix.provider }}."
            exit "${exit_code:-1}"
          }
          if grep -Eiq 'ModLoadingException|Failed to complete lifecycle event|Exception in thread "main"|FATAL.*jetsetcraft' "$log"; then
            echo "::error::Fatal mod-loading/runtime error with ${{ matrix.provider }} present."
            exit 1
          fi

      - name: Seal evidence
        shell: bash
        run: |
          mkdir -p build/verification
          sha256sum build/libs/*.jar > "build/verification/wave2-${{ matrix.provider }}-SHA256SUMS.txt"

      - name: Upload provider-present evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jetsetcraft-wave2-${{ matrix.provider }}-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/verification/wave2-${{ matrix.provider }}-*.log
            build/verification/wave2-${{ matrix.provider }}-SHA256SUMS.txt
          if-no-files-found: warn
