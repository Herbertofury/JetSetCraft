name: Check Wiki receipt provenance
on:
  pull_request:
    paths:
      - '.github/workflows/verify-wiki-receipt.yml'
      - '.agents-memory/WIKI_PUBLICATION.json'
      - 'tools/wiki_receipt*.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python tools/wiki_receipt_test.py
      - run: python tools/wiki_receipt.py .agents-memory/WIKI_PUBLICATION.json
