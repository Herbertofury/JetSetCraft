name: Promote current JetSetCraft source

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Arm one-time JetSetCraft source promotion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Promote verified 45fbd79 source payload
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT=b9de8a99ab3a17e088cf99fcfd19ccb04c468763
          actual_parent="$(git rev-parse HEAD^)"
          if [[ "$actual_parent" != "$EXPECTED_PARENT" ]]; then
            echo "::error::Expected parent $EXPECTED_PARENT, got $actual_parent"
            exit 1
          fi

          git fetch origin jetsetcraft-publish-45fbd79
          git show origin/jetsetcraft-publish-45fbd79:.bootstrap/source-delta.patch.gz.b64 | tr -d '[:space:]' | base64 -d > /tmp/source-delta.patch.gz
          echo '6c2a63ba340f1a9f395cec89c467cde2007fea21e57af90f666146169e07e558  /tmp/source-delta.patch.gz' | sha256sum -c -
          gzip -dc /tmp/source-delta.patch.gz > /tmp/source-delta.patch
          echo '1cd8689c23cff01c019b22667075c78ffe1c939f54acaa5f0b900f62f17afe82  /tmp/source-delta.patch' | sha256sum -c -
          git apply --3way /tmp/source-delta.patch

          git show origin/jetsetcraft-publish-45fbd79:.bootstrap/ClientEvents.java.b64 | tr -d '[:space:]' | base64 -d > src/main/java/com/herberto/jetsetcraft/client/ClientEvents.java
          git show origin/jetsetcraft-publish-45fbd79:.bootstrap/RideAnimationController.java.b64 | tr -d '[:space:]' | base64 -d > src/main/java/com/herberto/jetsetcraft/client/animation/RideAnimationController.java
          echo '735c589e6bbe4bdd561e9b937fdc7758106e0399591e771a4b0954ea6784d204  src/main/java/com/herberto/jetsetcraft/client/ClientEvents.java' | sha256sum -c -
          echo '2933259e3a2bcb77196b320ad15364f88ea086067c59dc18625b49be4f0225b3  src/main/java/com/herberto/jetsetcraft/client/animation/RideAnimationController.java' | sha256sum -c -

          rm -f .github/workflows/promote-current-source.yml
          git add -A
          git config user.name 'JetSetCraft Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Promote vanilla-world mechanics and hardened ride systems'
          git push origin HEAD:main
