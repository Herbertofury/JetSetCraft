name: Repair JetSetCraft LazyOptional compile gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ci-889c8ef-pr'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI head branch
        uses: actions/checkout@v4
        with:
          ref: ci-889c8ef-pr
          fetch-depth: 0

      - name: Apply Forge 1.20.1 LazyOptional API repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/herberto/jetsetcraft/command/JetSetCommands.java')
          s = p.read_text(encoding='utf-8')
          old_start = '        player.getCapability(JetSetDataProvider.CAPABILITY).ifPresentOrElse(data -> {\n'
          old_end = '        }, () -> source.sendFailure(Component.literal("JetSetCraft capability is not attached to this player.")));\n        return 1;\n'
          if old_start not in s:
              print('LazyOptional repair already present; nothing to change.')
              raise SystemExit(0)
          if old_end not in s:
              raise SystemExit('Expected LazyOptional closing pattern not found; refusing broad edit.')
          s = s.replace(old_start,
              '        JetSetData data = player.getCapability(JetSetDataProvider.CAPABILITY).resolve().orElse(null);\n'
              '        if (data == null) {\n'
              '            source.sendFailure(Component.literal("JetSetCraft capability is not attached to this player."));\n'
              '            return 0;\n'
              '        }\n\n', 1)
          s = s.replace(old_end, '        return 1;\n', 1)
          p.write_text(s, encoding='utf-8')
          PY

          python3 tools/validate_gameplay_contract.py
          git diff --check

          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'JetSetCraft CI Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add src/main/java/com/herberto/jetsetcraft/command/JetSetCommands.java
          git commit -m 'Fix Forge LazyOptional diagnostics access'
          git push origin HEAD:ci-889c8ef-pr
